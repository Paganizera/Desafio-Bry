name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Publish Executable JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit and integration tests
        env:
          PKCS12_ALIAS: e2618a8b-20de-4dd2-b209-70912e3177f4
          PKCS12_PASSWD: bry123456
        run: mvn -B clean verify

      - name: Package executable JAR and generate SHA-256 checksum
        run: |
          mvn -B package -DskipTests
          JAR_FILE=$(ls target/*.jar | grep -v '\.original$' | head -n 1)
          sha256sum "$JAR_FILE" > "${JAR_FILE}.sha256"

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "Desafio Back-End Java - ${{ steps.tag.outputs.value }}"
          generate_release_notes: true
          files: |
            target/*.jar
            !target/*.jar.original
            target/*.jar.sha256
            src/main/resources/output/doc.p7s
            src/test/resources/artifacts/doc-hash
